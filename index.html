<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>План на день</title>
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="План">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#F5F3EE; --card:#FFFFFF; --text:#26282B; --muted:#8A8D91; --line:#E6E2DA;
  --accent:#5E8B6E; --accent-soft:#E4EEE6; --on-accent:#FFFFFF;
  --hot:#C4574A; --hot-soft:#F7E3DF; --warn:#A87424; --warn-soft:#F6EBD8;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17191A; --card:#212426; --text:#E8E6E1; --muted:#8E9295; --line:#2F3336;
    --accent:#8DB89A; --accent-soft:#25332A; --on-accent:#10160F;
    --hot:#E08476; --hot-soft:#3A2522; --warn:#D9A94F; --warn-soft:#382D1A;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));min-height:100vh;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{padding:20px 0 8px}
header.top h1{font-size:28px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
header.top .sub{color:var(--muted);margin-top:4px;font-size:15px}
.progress{height:4px;border-radius:2px;background:var(--line);margin-top:12px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}

section.block{margin-top:22px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 8px}
.block-h h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0;font-weight:600}
.block-h .cnt{font-size:13px;color:var(--muted)}
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.list:empty{display:none}
.empty{color:var(--muted);font-size:15px;padding:14px 16px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}

.task{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 14px;min-height:52px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;transition:.15s}
.check svg{width:14px;height:14px;opacity:0}
.task.done .check{background:var(--accent);border-color:var(--accent)}
.task.done .check svg{opacity:1;stroke:var(--on-accent)}
.task .body{flex:1;min-width:0;padding:2px 0;cursor:pointer}
.task .title{word-wrap:break-word}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.meta:empty{display:none}
.badge{font-size:12px;line-height:1;padding:4px 7px;border-radius:6px;background:var(--bg);color:var(--muted);white-space:nowrap}
.badge.hot{background:var(--hot-soft);color:var(--hot);font-weight:600}
.badge.warn{background:var(--warn-soft);color:var(--warn);font-weight:600}
.task.done .badge{opacity:.6}
.icon-btn{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:var(--bg)}
.icon-btn svg{width:20px;height:20px}
.pill{flex:none;font-size:14px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:999px;white-space:nowrap}
.pill:active{opacity:.7}

.add-row{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;color:var(--accent);font-weight:500;border-top:1px solid var(--line);background:var(--card)}
.list-wrap{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.list-wrap .list{box-shadow:none;border-radius:0}
.list-wrap .list:empty + .add-row{border-top:0}
.add-row svg{width:20px;height:20px}

.big-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:22px;padding:14px;border-radius:var(--r);
  background:var(--accent-soft);color:var(--accent);font-weight:600}
.big-btn:active{opacity:.75}
.big-btn .n{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:13px;padding:1px 8px}

.group-h{font-size:13px;font-weight:600;margin:22px 4px 8px;display:flex;align-items:center;gap:6px}
.group-h.hot{color:var(--hot)} .group-h.warn{color:var(--warn)} .group-h.rest{color:var(--muted)}
.group-h .dot{width:8px;height:8px;border-radius:50%;background:currentColor}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;color:var(--muted);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
nav.tabs .n{position:absolute;top:4px;left:calc(50% + 8px);font-size:10px;font-weight:700;background:var(--hot);color:#fff;border-radius:999px;padding:1px 5px;line-height:1.3}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;opacity:0;transition:opacity .2s}
.backdrop.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92vh;overflow:auto;background:var(--bg);
  border-radius:18px 18px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:4px 0 16px;font-size:20px}
.field{margin-bottom:14px}
.field label.l{display:block;font-size:13px;color:var(--muted);margin:0 4px 6px}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:14px;color:var(--muted);text-align:center}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.urgent.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn{display:block;width:100%;padding:14px;border-radius:12px;font-weight:600;text-align:center;background:var(--card);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{color:var(--hot)}
.btn:active{opacity:.75}
.btns{display:grid;gap:8px;margin-top:18px}
.btns.two{grid-template-columns:1fr 1fr}
.clear{flex:none;width:44px;height:46px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--muted)}

/* pick sheet */
.pick .task{padding-right:12px}

/* archive */
.day-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 8px}
.day-h b{font-size:15px}
.day-h span{font-size:13px;color:var(--muted)}

/* settings */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-top:16px}
.card h2{font-size:17px;margin:0 0 6px}
.card p{margin:0 0 12px;color:var(--muted);font-size:15px}
.card ol{margin:0;padding-left:20px;color:var(--muted);font-size:15px}
.card .btns{margin-top:0}
.small{font-size:13px;color:var(--muted);text-align:center;margin:22px 0 8px}

/* toast */
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;z-index:30;
  background:var(--text);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;
  font-size:15px;max-width:calc(100% - 32px);width:max-content;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--accent);font-weight:700;padding:4px 6px}
@media (prefers-color-scheme: dark){.toast button{color:#4E7A5D}}
/* drag */
#app .task{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.handle{flex:none;width:40px;height:44px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab}
.handle svg{width:18px;height:18px}
.task.ph{opacity:.25}
.drag-ghost{position:fixed;z-index:40;pointer-events:none;background:var(--card);border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.22);transform:scale(1.03);border-top:0!important}
body.dragging{-webkit-user-select:none;user-select:none}
body.dragging .list[data-place]{display:block;min-height:52px;outline:2px dashed var(--line);outline-offset:-2px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:12px 16px 0}

/* free window */
.win{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:2px;scrollbar-width:none}
.win::-webkit-scrollbar{display:none}
.win .chip{flex:none;padding:7px 12px}
.muted-note{font-size:13px;color:var(--muted);margin:10px 4px 0}

/* week */
.day{margin-top:22px}
.day .block-h h2{text-transform:none;letter-spacing:0;font-size:15px;color:var(--text)}
.day.weekend .block-h h2{color:var(--accent)}
.plan-x{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:18px}
.quick{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.hidden{display:none!important}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<nav class="tabs"><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Сегодня</button>
  <button data-tab="backlog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>Отложенные<span class="n hidden" id="hotN"></span></button>
  <button data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Неделя</button>
  <button data-tab="archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></svg>Архив</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ещё</button>
</div></nav>

<div class="backdrop hidden" id="backdrop"></div>
<div class="sheet hidden" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"><span id="toastT"></span><button id="toastB">Отменить</button></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
(() => {
'use strict';
const KEY = 'planner.v1';
const VERSION = '2.1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const dstr = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const daysTo = s => Math.round((Date.UTC(...ymd(s)) - Date.UTC(...ymd(dstr()))) / 864e5);
function ymd(s){ const [y,m,d] = s.split('-').map(Number); return [y, m - 1, d]; }
const plural = (n, f) => { n = Math.abs(n); const a = n % 100, b = n % 10;
  return f[(a > 10 && a < 20) ? 2 : b === 1 ? 0 : (b >= 2 && b <= 4) ? 1 : 2]; };
const DUR = [['5','5 мин'],['30','15–30 мин'],['60','1 час'],['half','Полдня']];
const DURV = { '5':5, '30':30, '60':60, 'half':240 };
const WIN = [[null,'Всё'],['5','5 мин'],['30','30 мин'],['60','Час'],['half','Полдня']];
const WIN_TXT = { '5':'5 минут', '30':'полчаса', '60':'час', 'half':'полдня' };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const shortDate = s => parseD(s).toLocaleDateString('ru-RU', { weekday:'short', day:'numeric', month:'short' });
const durLabel = v => (DUR.find(d => d[0] === v) || [,''])[1];
const PLACES = [['must','Обязательное'],['optional','Необязательное'],['backlog','Отложенные']];

// ---------- state ----------
let S = load();
function blank(){ return { v:1, tasks:[], archive:[], day:dstr(), lastBackup:null }; }
function load(){
  try { const r = localStorage.getItem(KEY); if (r) { const d = JSON.parse(r); if (d && Array.isArray(d.tasks)) return Object.assign(blank(), d); } } catch(e) {}
  return blank();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { toast('Не получилось сохранить'); } }
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}

// ---------- day change ----------
function rollover(){
  const t = dstr();
  if (S.day === t) return;
  let back = 0, arch = 0;
  S.tasks = S.tasks.filter(x => {
    if (x.place === 'backlog') return true;
    if (x.done) { S.archive.push(toArchive(x, x.doneDate || S.day)); arch++; return false; }
    x.place = 'backlog'; x.done = false; back++; return true;
  });
  S.day = t;
  const planned = applyPlans(); save();
  if (back || arch || planned) {
    const parts = [];
    if (planned) parts.push(`${planned} ${plural(planned,['запланированное','запланированных','запланированных'])} в плане`);
    if (arch) parts.push(`${arch} ${plural(arch,['дело','дела','дел'])} в архиве`);
    if (back) parts.push(`${back} ${plural(back,['вернулось','вернулись','вернулись'])} в отложенные`);
    setTimeout(() => toast('Новый день: ' + parts.join(', ')), 300);
  }
}
function applyPlans(){
  const t = dstr(); let n = 0;
  S.tasks.forEach(x => { if (x.place === 'backlog' && x.planDate && x.planDate <= t) { x.place = 'optional'; x.planDate = null; x.done = false; x.order = Date.now() + n; n++; } });
  return n;
}
function toArchive(x, date){
  return { id:x.id, title:x.title, note:x.note||'', urgent:!!x.urgent, deadline:x.deadline||null, dur:x.dur||null,
           from:x.place, doneDate:date, doneAt:x.doneAt||Date.now(), createdAt:x.createdAt };
}

// ---------- undo ----------
let undoSnap = null, toastTimer = null;
function snapshot(){ undoSnap = JSON.stringify(S); }
function toast(text, undo = false){
  $('#toastT').textContent = text;
  $('#toastB').classList.toggle('hidden', !undo);
  if (!undo) undoSnap = null;
  const el = $('#toast'); el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.classList.remove('on'); undoSnap = null; }, undo ? 4500 : 3000);
}
$('#toastB').onclick = () => { if (undoSnap) { S = JSON.parse(undoSnap); undoSnap = null; save(); render(); } $('#toast').classList.remove('on'); };

// ---------- helpers ----------
const byId = id => S.tasks.find(t => t.id === id);
function deadlineBadge(t){
  if (!t.deadline) return '';
  const n = daysTo(t.deadline);
  let txt, cls = n <= 3 ? 'hot' : '';
  if (n < 0) txt = `просрочено на ${-n} ${plural(n,['день','дня','дней'])}`;
  else if (n === 0) txt = 'дедлайн сегодня';
  else if (n === 1) txt = 'дедлайн завтра';
  else if (n <= 3) txt = `через ${n} ${plural(n,['день','дня','дней'])}`;
  else txt = 'до ' + parseD(t.deadline).toLocaleDateString('ru-RU', { day:'numeric', month:'short' });
  return `<span class="badge ${cls}">${txt}</span>`;
}
function badges(t){
  let h = '';
  if (t.urgent) h += '<span class="badge warn">срочно</span>';
  h += deadlineBadge(t);
  if (t.dur) h += `<span class="badge">${durLabel(t.dur)}</span>`;
  if (t.planDate && t.place === 'backlog') h += `<span class="badge">📅 ${shortDate(t.planDate)}</span>`;
  if (t.note) h += '<span class="badge">📝</span>';
  return h;
}
function backlogRank(t){
  if (t.deadline) { const n = daysTo(t.deadline); if (n <= 3) return [0, n, t.createdAt]; }
  if (t.urgent) return [1, t.deadline ? daysTo(t.deadline) : 9e9, t.createdAt];
  return [2, t.deadline ? daysTo(t.deadline) : 9e9, t.createdAt];
}
function sortedBacklog(){
  return S.tasks.filter(t => t.place === 'backlog').map(t => ({ t, r: backlogRank(t) }))
    .sort((a, b) => a.r[0] - b.r[0] || a.r[1] - b.r[1] || a.r[2] - b.r[2]);
}
const hotCount = () => S.tasks.filter(t => t.place === 'backlog' && t.deadline && daysTo(t.deadline) <= 3).length;
const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  restore:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
};

// ---------- render ----------
let tab = 'today';
try { const s = sessionStorage.getItem('planner.tab'); if (s) tab = s; } catch(e) {}
function setTab(t){ tab = t; try { sessionStorage.setItem('planner.tab', t); } catch(e) {} render(); window.scrollTo(0, 0); }

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const h = hotCount(); const hn = $('#hotN'); hn.textContent = h; hn.classList.toggle('hidden', !h);
  $('#app').innerHTML = ({ today:vToday, backlog:vBacklog, week:vWeek, archive:vArchive, settings:vSettings }[tab] || vToday)();
}

function todayRow(t){
  const swap = `<span class="handle" aria-label="Перетащить">${ICON.grip}</span>`;
  return `<div class="task ${t.done ? 'done' : ''}" data-id="${t.id}">
    <button class="check" data-act="toggle" aria-label="Готово">${ICON.check}</button>
    <div class="body" data-act="edit"><div class="title">${esc(t.title)}</div><div class="meta">${badges(t)}</div></div>
    ${t.done ? '' : swap}</div>`;
}
function sectionList(place){
  const items = S.tasks.filter(t => t.place === place)
    .sort((a, b) => (a.done - b.done) || (a.done ? a.doneAt - b.doneAt : a.order - b.order));
  return items;
}
function vToday(){
  const must = sectionList('must'), opt = sectionList('optional');
  const all = must.length + opt.length, done = must.concat(opt).filter(t => t.done).length;
  const date = new Date().toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' });
  const bl = S.tasks.filter(t => t.place === 'backlog').length;
  const sec = (place, title, items) => `
    <section class="block">
      <div class="block-h"><h2>${title}</h2><span class="cnt">${items.length ? items.filter(t=>t.done).length + ' / ' + items.length : ''}</span></div>
      <div class="list-wrap"><div class="list" data-place="${place}">${items.map(todayRow).join('')}</div>
      <button class="add-row" data-act="add" data-place="${place}">${ICON.plus}Добавить</button></div>
    </section>`;
  return `
    <header class="top"><h1>${date[0].toUpperCase() + date.slice(1)}</h1>
      <div class="sub">${all ? `Сделано ${done} из ${all}` : 'План пока пуст'}</div>
      ${all ? `<div class="progress"><i style="width:${Math.round(done / all * 100)}%"></i></div>` : ''}
    </header>
    ${sec('must', 'Обязательное', must)}
    ${sec('optional', 'Необязательное', opt)}
    ${must.concat(opt).some(t => !t.done) ? '<div class="hint">Чтобы переставить дело или перенести в другой блок, тяни его за ⠿ справа или удерживай палец на деле.</div>' : ''}
    <button class="big-btn" data-act="pick">Взять из отложенных ${bl ? `<span class="n">${bl}</span>` : ''}</button>`;
}

// mode: 'list' (вкладка), 'pick' (в сегодня), 'plan' (на дату)
function backlogRow(t, mode){
  const btn = mode === 'plan' ? `<button class="pill" data-act="plan-here">+ Сюда</button>`
    : `<button class="pill" data-act="${mode === 'pick' ? 'take-stay' : 'take'}">→ Сегодня</button>`;
  return `<div class="task" data-id="${t.id}">
    <div class="body" data-act="edit"><div class="title">${esc(t.title)}</div><div class="meta">${badges(t)}</div></div>
    ${btn}</div>`;
}
let win = null;
try { win = sessionStorage.getItem('planner.win') || null; } catch(e) {}
function winChips(){
  return `<div class="win">${WIN.map(([v, l]) => `<button class="chip ${win === v ? 'on' : ''}" data-act="win" data-v="${v || ''}">${l}</button>`).join('')}</div>`;
}
function backlogGroups(mode){
  let list = sortedBacklog();
  if (mode === 'plan') list = list.filter(x => x.t.planDate !== planFor);
  if (!list.length) return `<div class="empty" style="margin-top:22px">Отложенных дел нет.</div>`;
  let note = '';
  if (win) {
    const lim = DURV[win], all = list.length;
    list = list.filter(x => x.t.dur && DURV[x.t.dur] <= lim);
    const noDur = sortedBacklog().filter(x => !x.t.dur).length;
    note = `<div class="muted-note">Показаны дела, которые можно успеть за ${WIN_TXT[win]}.${noDur ? ` Дела без оценки времени (${noDur}) скрыты — поставь им «Сколько времени».` : ''}</div>`;
    if (!list.length) return note + `<div class="empty" style="margin-top:14px">Под это окно ничего не подходит.</div>`;
  }
  const groups = [
    ['hot', 'Горит: дедлайн близко', list.filter(x => x.r[0] === 0)],
    ['warn', 'Срочные', list.filter(x => x.r[0] === 1)],
    ['rest', 'Остальные', list.filter(x => x.r[0] === 2)],
  ];
  return groups.filter(g => g[2].length).map(([c, title, arr]) => `
    <div class="group-h ${c}"><span class="dot"></span>${title} · ${arr.length}</div>
    <div class="list">${arr.map(x => backlogRow(x.t, mode)).join('')}</div>`).join('') + note;
}
function vBacklog(){
  const n = S.tasks.filter(t => t.place === 'backlog').length;
  return `
    <header class="top"><h1>Отложенные</h1><div class="sub">${n ? `${n} ${plural(n,['дело','дела','дел'])} на потом` : 'Дела на потом, когда будет окно'}</div></header>
    <button class="big-btn" data-act="add" data-place="backlog" style="margin-top:14px">${ICON.plus.replace('<svg','<svg width="20" height="20"')}Новое дело</button>
    ${n ? winChips() : ''}
    ${backlogGroups('list')}`;
}

function vWeek(){
  const today = dstr(); let html = '';
  for (let i = 1; i <= 7; i++) {
    const d = addDays(today, i), dt = parseD(d);
    const items = S.tasks.filter(t => t.place === 'backlog' && t.planDate === d).sort((a, b) => a.createdAt - b.createdAt);
    let label = dt.toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' });
    label = (i === 1 ? 'Завтра, ' : i === 2 ? 'Послезавтра, ' : '') + (i <= 2 ? label : label[0].toUpperCase() + label.slice(1));
    const we = dt.getDay() === 0 || dt.getDay() === 6;
    html += `<section class="day ${we ? 'weekend' : ''}">
      <div class="block-h"><h2>${label}</h2><span class="cnt">${items.length || ''}</span></div>
      <div class="list-wrap"><div class="list">${items.map(t => weekRow(t)).join('')}</div>
      <button class="add-row" data-act="plan-pick" data-date="${d}">${ICON.plus}Добавить из отложенных</button></div></section>`;
  }
  const later = S.tasks.filter(t => t.place === 'backlog' && t.planDate && t.planDate > addDays(today, 7)).sort((a, b) => a.planDate < b.planDate ? -1 : 1);
  if (later.length) html += `<section class="day"><div class="block-h"><h2>Позже</h2><span class="cnt">${later.length}</span></div>
    <div class="list">${later.map(t => weekRow(t)).join('')}</div></section>`;
  return `<header class="top"><h1>Неделя</h1><div class="sub">Раскидай отложенные по дням — в свой день дело само появится в «Сегодня»</div></header>${html}`;
}
function weekRow(t){
  return `<div class="task" data-id="${t.id}">
    <div class="body" data-act="edit"><div class="title">${esc(t.title)}</div><div class="meta">${badges(t).replace(/<span class="badge">📅[^<]*<\/span>/, '')}</div></div>
    <button class="plan-x" data-act="unplan" aria-label="Убрать с этого дня">✕</button></div>`;
}

function vArchive(){
  const days = {};
  S.archive.forEach(a => (days[a.doneDate] = days[a.doneDate] || []).push(a));
  const keys = Object.keys(days).sort().reverse();
  const weekAgo = dstr(new Date(Date.now() - 6 * 864e5));
  const week = S.archive.filter(a => a.doneDate >= weekAgo).length;
  const FROM = { must:'обязательное', optional:'необязательное', backlog:'из отложенных' };
  const dayLabel = k => { const n = daysTo(k); if (n === 0) return 'Сегодня'; if (n === -1) return 'Вчера';
    const s = parseD(k).toLocaleDateString('ru-RU', { weekday:'short', day:'numeric', month:'long' }); return s[0].toUpperCase() + s.slice(1); };
  return `
    <header class="top"><h1>Архив</h1><div class="sub">${S.archive.length ? `За последние 7 дней: ${week} ${plural(week,['дело','дела','дел'])}` : 'Здесь соберётся всё, что ты сделала'}</div></header>
    ${keys.map(k => `
      <div class="day-h"><b>${dayLabel(k)}</b><span>${days[k].length}</span></div>
      <div class="list">${days[k].sort((a,b) => a.doneAt - b.doneAt).map(a => `
        <div class="task done" data-aid="${a.id}">
          <span class="check">${ICON.check}</span>
          <div class="body"><div class="title">${esc(a.title)}</div><div class="meta"><span class="badge">${FROM[a.from] || ''}</span></div></div>
          <button class="icon-btn" data-act="restore" aria-label="Вернуть в отложенные">${ICON.restore}</button>
        </div>`).join('')}</div>`).join('')}
    ${keys.length ? '' : '<div class="empty" style="margin-top:22px">Пока пусто. Сделанные дела попадают сюда в конце дня.</div>'}`;
}

function vSettings(){
  const lb = S.lastBackup ? new Date(S.lastBackup).toLocaleDateString('ru-RU', { day:'numeric', month:'long' }) : null;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  return `
    <header class="top"><h1>Ещё</h1></header>
    <div class="card"><h2>Резервная копия</h2>
      <p>Все дела хранятся только на этом телефоне. Раз в неделю-две сохраняй копию в Файлы, чтобы ничего не потерять.${lb ? ` Последняя копия: ${lb}.` : ''}</p>
      <div class="btns"><button class="btn primary" data-act="export">Сохранить копию</button>
      <button class="btn" data-act="import">Загрузить из копии</button></div></div>
    ${standalone ? '' : `<div class="card"><h2>Установить на экран</h2>
      ${isIOS ? `<ol><li>Открой эту страницу в Safari</li><li>Нажми «Поделиться» (квадрат со стрелкой)</li><li>Выбери «На экран „Домой“»</li></ol>`
              : `<p>В меню браузера выбери «Установить приложение» или «Добавить на главный экран».</p>`}</div>`}
    <div class="card"><h2>Как это работает</h2>
      <ol><li>Всё «на потом» живёт в «Отложенных». Сверху то, у чего дедлайн через 3 дня или раньше, потом срочное, потом остальное.</li>
      <li>«→ Сегодня» переносит дело в план на день. Потяни дело за ⠿ (или удерживай палец на нём), чтобы переставить или перенести между «Обязательным» и «Необязательным».</li>
      <li>«Свободное окно» в «Отложенных»: выбери, сколько у тебя времени, и останутся только дела, которые успеешь.</li>
      <li>«Неделя»: назначь дело на день — утром того дня оно само окажется в «Сегодня». Любое дело можно перенести на другой день в его карточке.</li>
      <li>Ночью день закрывается сам: сделанное уходит в архив, несделанное возвращается в отложенные.</li></ol></div>
    <div class="card"><div class="btns"><button class="btn danger" data-act="wipe">Удалить все данные</button></div></div>
    <div class="small">План на день · версия ${VERSION}</div>`;
}

// ---------- sheet ----------
let sheetOpen = false;
function openSheet(html){
  delete $('#sheetIn').dataset.pick;
  $('#sheetIn').innerHTML = '<div class="grab"></div>' + html;
  const b = $('#backdrop'), s = $('#sheet');
  b.classList.remove('hidden'); s.classList.remove('hidden');
  requestAnimationFrame(() => { b.classList.add('on'); s.classList.add('on'); });
  sheetOpen = true;
}
function closeSheet(){
  if (!sheetOpen) return;
  const b = $('#backdrop'), s = $('#sheet');
  b.classList.remove('on'); s.classList.remove('on'); sheetOpen = false; delete $('#sheetIn').dataset.pick;
  document.activeElement && document.activeElement.blur && document.activeElement.blur();
  setTimeout(() => { if (!sheetOpen) { b.classList.add('hidden'); s.classList.add('hidden'); $('#sheetIn').innerHTML = ''; } }, 260);
}
$('#backdrop').onclick = closeSheet;

let form = null; // {mode:'add'|'edit', id, place, urgent, dur}
function openForm(mode, t){
  const isEdit = mode === 'edit';
  form = { mode, id: t.id, place: t.place, urgent: !!t.urgent, dur: t.dur || null };
  openSheet(`
    <h3>${isEdit ? 'Дело' : 'Новое дело'}</h3>
    <div class="field"><input class="inp" id="fTitle" placeholder="Что сделать?" value="${esc(t.title || '')}" enterkeyhint="done" autocomplete="off"></div>
    <div class="field"><label class="l">Куда</label><div class="seg" id="fPlace">
      ${PLACES.map(([v, l]) => `<button data-v="${v}" class="${form.place === v ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    <div class="field"><label class="l">Срочность и дедлайн</label>
      <div class="row"><button class="chip urgent ${form.urgent ? 'on' : ''}" id="fUrgent">Срочно</button>
      <input class="inp" type="date" id="fDeadline" value="${t.deadline || ''}" style="flex:1">
      <button class="clear" id="fClear" aria-label="Убрать дедлайн">✕</button></div></div>
    <div class="field"><label class="l">Перенести на день</label>
      <div class="row"><input class="inp" type="date" id="fPlan" value="${t.planDate || ''}" min="${dstr()}" style="flex:1">
      <button class="clear" id="fPlanClear" aria-label="Не планировать">✕</button></div>
      <div class="quick"><button class="chip" data-d="1">Завтра</button><button class="chip" data-d="2">Послезавтра</button><button class="chip" data-d="7">Через неделю</button></div></div>
    <div class="field"><label class="l">Сколько времени</label><div class="chips" id="fDur">
      ${DUR.map(([v, l]) => `<button class="chip ${form.dur === v ? 'on' : ''}" data-v="${v}">${l}</button>`).join('')}</div></div>
    <div class="field"><label class="l">Заметка</label><textarea class="inp" id="fNote" placeholder="Подробности, ссылка…">${esc(t.note || '')}</textarea></div>
    <div class="btns"><button class="btn primary" id="fSave">${isEdit ? 'Сохранить' : 'Добавить'}</button></div>
    ${isEdit ? `<div class="btns two" style="margin-top:8px">
      ${t.place === 'backlog' ? '<button class="btn" id="fDone">Сделано</button>' : (t.done ? '<button class="btn" id="fDone">Не сделано</button>' : '<button class="btn" id="fDone">Сделано</button>')}
      <button class="btn danger" id="fDel">Удалить</button></div>` : ''}`);
  const title = $('#fTitle');
  if (!isEdit) setTimeout(() => title.focus(), 280);
  title.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitForm(); } });
  $('#fPlace').onclick = e => { const b = e.target.closest('button'); if (!b) return; form.place = b.dataset.v;
    $('#fPlace').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  $('#fUrgent').onclick = e => { form.urgent = !form.urgent; e.currentTarget.classList.toggle('on', form.urgent); };
  $('#fClear').onclick = () => { $('#fDeadline').value = ''; };
  $('#fPlanClear').onclick = () => { $('#fPlan').value = ''; };
  $('#sheetIn').querySelectorAll('.quick .chip').forEach(b => b.onclick = () => { $('#fPlan').value = addDays(dstr(), +b.dataset.d); });
  $('#fDur').onclick = e => { const b = e.target.closest('button'); if (!b) return; form.dur = form.dur === b.dataset.v ? null : b.dataset.v;
    $('#fDur').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === form.dur)); };
  $('#fSave').onclick = submitForm;
  if (isEdit) {
    $('#fDel').onclick = () => { snapshot(); S.tasks = S.tasks.filter(x => x.id !== form.id); save(); closeSheet(); render(); toast('Удалено', true); };
    $('#fDone').onclick = () => {
      const x = byId(form.id); if (!x) return;
      applyForm(x);
      snapshot();
      if (x.place === 'backlog') { x.place = 'optional'; x.planDate = null; x.order = Date.now(); setDone(x, true); toast('Сделано — зачёркнуто в «Сегодня»', true); }
      else { setDone(x, !x.done); }
      save(); closeSheet(); render();
    };
  }
}
function applyForm(x){
  const title = $('#fTitle').value.trim(); if (title) x.title = title;
  const np = form.place;
  if (np !== x.place) { if (np === 'backlog') { x.done = false; x.doneAt = null; x.doneDate = null; } x.place = np; x.order = Date.now(); }
  x.urgent = form.urgent; x.deadline = $('#fDeadline').value || null; x.dur = form.dur; x.note = $('#fNote').value.trim();
  const pd = $('#fPlan').value || null, today = dstr();
  if (pd && pd > today) { x.planDate = pd; if (x.place !== 'backlog') { x.place = 'backlog'; x.done = false; x.doneAt = null; x.doneDate = null; } }
  else if (pd && pd <= today) { x.planDate = null; if (x.place === 'backlog') { x.place = 'optional'; x.order = Date.now(); } }
  else x.planDate = null;
}
function submitForm(){
  const title = $('#fTitle').value.trim();
  if (!title) { $('#fTitle').focus(); return; }
  if (form.mode === 'add') {
    const x = { id: uid(), title, place: form.place, done:false, createdAt: Date.now(), order: Date.now() };
    applyForm(x); S.tasks.push(x);
  } else { const x = byId(form.id); if (x) applyForm(x); }
  save(); closeSheet(); render();
  const x = form.mode === 'add' ? S.tasks[S.tasks.length - 1] : byId(form.id);
  if (x && x.planDate && x.place === 'backlog') toast('Запланировано на ' + shortDate(x.planDate));
}
function setDone(x, v){ x.done = v; x.doneAt = v ? Date.now() : null; x.doneDate = v ? dstr() : null; }

let pickMode = 'pick', planFor = null;
function pickHtml(){
  const h = pickMode === 'plan' ? `На ${parseD(planFor).toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' })}` : 'Из отложенных';
  return `<h3>${h}</h3>${winChips()}<div class="pick">${backlogGroups(pickMode)}</div>
    <div class="btns"><button class="btn" data-act="close">Готово</button></div>`;
}
function openPick(mode = 'pick', date = null){
  pickMode = mode; planFor = date;
  openSheet(pickHtml());
  $('#sheetIn').dataset.pick = '1';
}
function refreshPick(){ if (sheetOpen && $('#sheetIn').dataset.pick) {
  const sc = $('#sheet').scrollTop;
  $('#sheetIn').innerHTML = '<div class="grab"></div>' + pickHtml(); $('#sheet').scrollTop = sc; } }

function confirmSheet(text, ok, cb){
  openSheet(`<h3>${text}</h3><div class="btns two"><button class="btn" data-act="close">Отмена</button><button class="btn danger" id="cOk">${ok}</button></div>`);
  $('#cOk').onclick = () => { closeSheet(); cb(); };
}

function takeToday(id){
  const x = byId(id); if (!x) return;
  snapshot(); x.place = 'optional'; x.done = false; x.planDate = null; x.order = Date.now(); save();
}

// ---------- backup ----------
async function doExport(){
  S.lastBackup = Date.now(); save();
  const data = JSON.stringify({ app:'planner', exportedAt: new Date().toISOString(), state: S }, null, 1);
  const name = `plan-backup-${dstr()}.json`;
  try {
    const file = new File([data], name, { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title:name }); render(); return; }
  } catch(e) { if (e && e.name === 'AbortError') { render(); return; } }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type:'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  render(); toast('Копия сохранена');
}
$('#importFile').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); const st = d.state || d;
      if (!st || !Array.isArray(st.tasks) || !Array.isArray(st.archive)) throw 0;
      confirmSheet(`Заменить текущие данные копией? В ней ${st.tasks.length} ${plural(st.tasks.length,['дело','дела','дел'])} и ${st.archive.length} в архиве.`, 'Заменить', () => {
        snapshot(); S = Object.assign(blank(), st); rollover(); save(); render(); toast('Данные загружены', true); });
    } catch(err) { toast('Это не похоже на копию планировщика'); }
  };
  r.readAsText(f);
};

// ---------- events ----------
document.addEventListener('click', e => {
  if (suppressClick) { e.preventDefault(); e.stopPropagation(); return; }
  const tb = e.target.closest('nav.tabs button'); if (tb) { setTab(tb.dataset.tab); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  const row = el.closest('[data-id]'); const id = row && row.dataset.id; const x = id && byId(id);
  switch (act) {
    case 'toggle': if (x) { setDone(x, !x.done); save(); render(); } break;
    case 'win': win = el.dataset.v || null; try { win ? sessionStorage.setItem('planner.win', win) : sessionStorage.removeItem('planner.win'); } catch(e) {}
      render(); refreshPick(); break;
    case 'plan-pick': openPick('plan', el.dataset.date); break;
    case 'plan-here': if (x) { snapshot(); x.planDate = planFor; save(); render(); refreshPick(); toast('Запланировано на ' + shortDate(planFor), true); } break;
    case 'unplan': if (x) { snapshot(); x.planDate = null; save(); render(); toast('Убрано с этого дня', true); } break;
    case 'edit': if (x) openForm('edit', x); break;
    case 'add': openForm('add', { place: el.dataset.place }); break;
    case 'take': if (x) { takeToday(id); render(); toast('Добавлено в «Сегодня»', true); } break;
    case 'take-stay': if (x) { takeToday(id); render(); refreshPick(); toast('Добавлено в «Сегодня»', true); } break;
    case 'pick': openPick(); break;
    case 'close': closeSheet(); break;
    case 'restore': {
      const aid = el.closest('[data-aid]').dataset.aid; const a = S.archive.find(y => y.id === aid); if (!a) break;
      snapshot(); S.archive = S.archive.filter(y => y !== a);
      S.tasks.push({ id:a.id, title:a.title, note:a.note, urgent:a.urgent, deadline:a.deadline, dur:a.dur, place:'backlog', done:false,
        createdAt:a.createdAt || Date.now(), order:Date.now() });
      save(); render(); toast('Вернула в отложенные', true); break; }
    case 'export': doExport(); break;
    case 'import': $('#importFile').click(); break;
    case 'wipe': confirmSheet('Удалить все дела и архив? Это не отменить.', 'Удалить', () => { S = blank(); save(); render(); toast('Всё удалено'); }); break;
  }
});

// ---------- drag & drop (Сегодня) ----------
let drag = null, pending = null, suppressClick = false, scrollRAF = null;
function startDrag(row, y){
  const r = row.getBoundingClientRect();
  const g = row.cloneNode(true); g.classList.add('drag-ghost');
  Object.assign(g.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px' });
  document.body.appendChild(g); row.classList.add('ph'); document.body.classList.add('dragging');
  drag = { row, g, dy: y - r.top, y };
  try { navigator.vibrate && navigator.vibrate(12); } catch(e) {}
  autoScroll();
}
function moveDrag(y){
  drag.y = y; drag.g.style.top = (y - drag.dy) + 'px';
  const lists = [...document.querySelectorAll('#app .list[data-place]')];
  let target = null, bestD = Infinity;
  for (const l of lists) { const r = l.getBoundingClientRect();
    const d = y < r.top ? r.top - y : y > r.bottom ? y - r.bottom : 0; if (d < bestD) { bestD = d; target = l; } }
  if (!target) return;
  const rows = [...target.querySelectorAll('.task:not(.ph):not(.done)')];
  let before = null;
  for (const el of rows) { const b = el.getBoundingClientRect(); if (y < b.top + b.height / 2) { before = el; break; } }
  if (!before) before = target.querySelector('.task.done');
  if (drag.row.parentElement !== target || drag.row.nextElementSibling !== before) target.insertBefore(drag.row, before);
}
function autoScroll(){
  if (!drag) return;
  const y = drag.y, h = window.innerHeight;
  if (y < 90) window.scrollBy(0, -Math.ceil((90 - y) / 6));
  else if (y > h - 130) window.scrollBy(0, Math.ceil((y - (h - 130)) / 6));
  scrollRAF = requestAnimationFrame(() => { if (drag) { moveDrag(drag.y); autoScroll(); } });
}
function endDrag(){
  cancelAnimationFrame(scrollRAF);
  const { row, g } = drag; drag = null;
  g.remove(); row.classList.remove('ph'); document.body.classList.remove('dragging');
  const x = byId(row.dataset.id), place = row.parentElement && row.parentElement.dataset.place;
  if (x && place) {
    x.place = place;
    document.querySelectorAll('#app .list[data-place]').forEach(l =>
      [...l.querySelectorAll('.task')].forEach((el, i) => { const t = byId(el.dataset.id); if (t && !t.done) { t.place = l.dataset.place; t.order = i; } }));
    save();
  }
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 350);
  render();
}
const dragRow = t => t.closest && t.closest('#app .list[data-place] .task:not(.done)');
document.addEventListener('touchstart', e => {
  if (drag || e.touches.length > 1) return;
  const row = dragRow(e.target); if (!row) return;
  const p = e.touches[0];
  if (e.target.closest('.handle')) { e.preventDefault(); startDrag(row, p.clientY); return; }
  if (e.target.closest('.check')) return;
  pending = { row, x: p.clientX, y: p.clientY, timer: setTimeout(() => { if (pending) { const pr = pending; pending = null; startDrag(pr.row, pr.y); } }, 420) };
}, { passive: false });
document.addEventListener('touchmove', e => {
  const p = e.touches[0];
  if (drag) { e.preventDefault(); moveDrag(p.clientY); return; }
  if (pending && Math.hypot(p.clientX - pending.x, p.clientY - pending.y) > 8) { clearTimeout(pending.timer); pending = null; }
}, { passive: false });
function touchEnd(e){
  if (pending) { clearTimeout(pending.timer); pending = null; }
  if (drag) { if (e.cancelable) e.preventDefault(); endDrag(); }
}
document.addEventListener('touchend', touchEnd, { passive: false });
document.addEventListener('touchcancel', touchEnd, { passive: false });
document.addEventListener('contextmenu', e => { if (dragRow(e.target)) e.preventDefault(); });
// мышь (компьютер)
document.addEventListener('mousedown', e => {
  if (e.button !== 0 || !e.target.closest('.handle')) return;
  const row = dragRow(e.target); if (!row) return; e.preventDefault(); startDrag(row, e.clientY);
});
document.addEventListener('mousemove', e => { if (drag) moveDrag(e.clientY); });
document.addEventListener('mouseup', () => { if (drag) endDrag(); });

function tick(){ const before = S.day; rollover(); if (S.day !== before) render(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); render(); } });
setInterval(tick, 60 * 1000);

if (applyPlans()) save();
rollover(); render();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
// test hook
window.__planner = { get S(){ return S; }, set S(v){ S = v; }, rollover, render, save, dstr };
})();
</script>
